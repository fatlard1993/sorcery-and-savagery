<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sorcery & Savagery</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		body {
			font-family: system-ui, -apple-system, sans-serif;
			background-color: #1a1a1a;
			color: #ffffff;
		}
	</style>
		<!-- crypto.randomUUID exists only in secure contexts (https or
		localhost) - served over plain http on the LAN (*.home) the
		@vanilla-bean framework (hypertether/oxject) crashes without it.
		Inline and before the bundle on purpose: it has to exist before any
		module code runs. getRandomValues has no secure-context restriction. -->
		<script>
			if (!crypto.randomUUID) {
				crypto.randomUUID = () =>
					([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c =>
						(c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16),
					);
			}
		</script>

	<script type="module" src="./index.js"></script>
</head>
<body></body>
</html>
